name: Bug report
description: Report a reproducible AgentShield bug.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal code or steps to reproduce.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AgentShield version
      placeholder: "0.2.0"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, optional extras, deployment mode.
