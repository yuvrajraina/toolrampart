name: Feature request
description: Suggest an improvement to AgentShield.
title: "Feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should AgentShield solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to happen?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core execution
        - REST API
        - MCP
        - CLI
        - Client SDK
        - Dashboard
        - Docs
        - Storage
