[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "toolrampart"
version = "0.2.0"
description = "FastAPI for safe AI tools."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ToolRampart Contributors" }]
keywords = [
  "ai-agents",
  "agents",
  "agent-tools",
  "mcp",
  "model-context-protocol",
  "fastapi",
  "security",
  "audit",
  "approvals",
  "idempotency",
  "tool-safety",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.5",
  "pyjwt[crypto]>=2.10",
  "typer>=0.12",
  "uvicorn>=0.29",
]

[project.urls]
Homepage = "https://github.com/toolrampart/toolrampart"
Documentation = "https://toolrampart.dev/"
Issues = "https://github.com/toolrampart/toolrampart/issues"
Docs = "https://toolrampart.dev/"
Source = "https://github.com/toolrampart/toolrampart"
Changelog = "https://github.com/toolrampart/toolrampart/blob/main/CHANGELOG.md"
Security = "https://github.com/toolrampart/toolrampart/security/policy"

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.6",
  "pymdown-extensions>=10.14",
]
mcp = [
  "mcp>=1.27",
]
postgres = [
  "psycopg[binary]>=3.2",
]
redis = [
  "redis>=5",
]
otel = [
  "opentelemetry-api>=1.38",
]
all = [
  "mcp>=1.27",
  "opentelemetry-api>=1.38",
  "psycopg[binary]>=3.2",
  "redis>=5",
]

[project.scripts]
toolrampart = "toolrampart.cli:main"

[tool.setuptools.packages.find]
include = ["toolrampart*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: tests that require external services such as Postgres or Redis",
]
