site_name: ToolRampart
site_url: https://toolrampart.dev/
site_description: FastAPI for safe AI tools. Expose Python functions as AI-agent and MCP tools with approvals, scopes, audit logs, idempotency, isolation, and observability.
site_author: ToolRampart Contributors
repo_name: toolrampart/toolrampart
repo_url: https://github.com/toolrampart/toolrampart
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 ToolRampart Contributors

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: teal

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/toolrampart/toolrampart
  generator: false

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts:
      - Safety Model: concepts/safety-model.md
      - Tool Policies: concepts/policies.md
      - Approvals: concepts/approvals.md
      - Idempotency: concepts/idempotency.md
      - Isolation: concepts/isolation.md
  - Guides:
      - Configuration: CONFIGURATION.md
      - Python Client: CLIENT.md
      - MCP: MCP.md
      - Operations: OPERATIONS.md
      - Deployment: DEPLOYMENT.md
      - Security: SECURITY.md
      - Threat Model: THREAT_MODEL.md
      - Production Checklist: PRODUCTION_CHECKLIST.md
      - Release Process: RELEASE.md
  - Examples:
      - Overview: examples/index.md
      - Read-only SQL Tool: examples/read-only-sql.md
      - CRM Update With Approval: examples/crm-update.md
      - GitHub Issue Creator: examples/github-issue.md
      - Isolated Long Job: examples/isolated-job.md
      - Destructive Admin Policy: examples/destructive-admin.md
      - MCP Client Usage: examples/mcp-client.md
  - For AI Agents:
      - Agent Guide: agents.md
      - LLM Index: llms.txt
